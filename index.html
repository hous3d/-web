<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HOUS3D, S.L. - Próximamente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: url('https://i.imgur.com/tjlvYzR.jpg') no-repeat center center;
      background-size: cover;
      color: #4b2e2e;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4em;
      margin-top: 40px;
    }

    h2 {
      font-size: 1.3em;
      margin-bottom: 40px;
      font-weight: 400;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .button {
      background-color: #fff;
      color: #4b2e2e;
      border: none;
      border-radius: 50px;
      padding: 12px 25px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      transition: background-color 0.3s ease;
    }

    .button:hover {
      background-color: #eee;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icons a {
      color: #4b2e2e;
      font-size: 1.5em;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .social-icons a:hover {
      color: #000;
    }

    .title {
      font-weight: bold;
      font-size: 1.2em;
      letter-spacing: 2px;
    }
  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <div class="title">HOUS3D, S.L.</div>
    <h1>¡Próximamente!</h1>
    <h2>Estamos realizando algunas mejoras en nuestro sitio web.</h2>
    <button class="button">NOTIFICAR</button>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook-square"></i></a>
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
    </div>
  </div>
</body>
</html>
